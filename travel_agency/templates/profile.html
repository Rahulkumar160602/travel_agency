<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-container {
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 500px;
            border-radius: 10px;
        }
        .profile-container h1 {
            text-align: center;
        }
        .profile-container input, .profile-container select, .profile-container textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .save-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        .save-btn:hover {
            background-color: #45a049;
        }
        .file-input {
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <h1>Welcome, {{ user.email }}</h1>

        <form method="POST" action="/profile/update/" enctype="multipart/form-data">
            {% csrf_token %}
            
            <input type="text" name="name" placeholder="Enter your name" value="{{ user.name }}" required>
            <input type="text" name="address" placeholder="Enter your address" value="{{ user.address }}" required>
            <input type="date" name="dob" placeholder="Enter your date of birth" value="{{ user.dob }}" required>
            <select name="gender" required>
                <option value="male" {% if user.gender == "male" %}selected{% endif %}>Male</option>
                <option value="female" {% if user.gender == "female" %}selected{% endif %}>Female</option>
                <option value="other" {% if user.gender == "other" %}selected{% endif %}>Other</option>
            </select>
        
            <textarea name="preferences" placeholder="Enter your travel preferences (destinations, activities, etc.)">{{ user.preferences }}</textarea>
            <input type="text" name="budget" placeholder="Enter your travel budget" value="{{ user.budget }}" required>
        
            <input type="url" name="linkedin" placeholder="Enter your LinkedIn URL" value="{{ user.linkedin }}">
            <input type="url" name="instagram" placeholder="Enter your Instagram URL" value="{{ user.instagram }}">
        
            <textarea name="travel_history" placeholder="Enter your past travel experiences (places visited, favorite destinations, etc.)">{{ user.travel_history }}</textarea>
        
            <input type="file" name="profile_picture" class="file-input">
            
            <button type="submit" class="save-btn">Save Profile</button>
        </form>
        
    </div>

</body>
</html>
